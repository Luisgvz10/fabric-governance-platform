[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricgov"
version = "0.1.0"
description = "Cliente HTTP reutilizable para las APIs de administracion de Microsoft Fabric y Power BI, usado por la plataforma de gobierno del TFM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.28",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
